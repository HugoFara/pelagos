# Publishes web/ to GitHub Pages.
#
# Uploads web/ as the site root rather than copying it to /docs, so
# https://<user>.github.io/pelagos/ serves web/index.html directly and the
# repository keeps one copy of the page. index.html is a committed build
# artifact (scripts/build_web_explorer.py renders web/template.html into it),
# so there is nothing to build here -- this only publishes what is committed.
name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
